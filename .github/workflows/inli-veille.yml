name: Veille in'li

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: veille-inli
  cancel-in-progress: false

jobs:
  surveiller:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verifier les annonces
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          INLI_URL: ${{ vars.INLI_URL }}
        run: python inli_watch.py

      - name: Sauvegarder l'etat
        run: |
          git config user.name "veille-inli"
          git config user.email "actions@github.com"
          git add -A
          git diff --staged --quiet || git commit -m "maj annonces"
          git push
